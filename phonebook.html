<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DFW Airport Phonebook</title>
<link href="https://fonts.googleapis.com/css2?family=Neue+Haas+Unica:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── DFW BRAND TOKENS ─────────────────────────────────────────────── */
:root {
  --dfw-orange:    #FF5000;
  --dfw-lgray:     #E6E6E6;
  --dfw-dgray:     #585858;
  --dfw-purple:    #41395F;
  --dfw-yellow:    #F2A900;
  --dfw-blue:      #3EB1C8;

  /* Light theme */
  --bg:            #F7F7F7;
  --bg2:           #FFFFFF;
  --bg3:           #EFEFEF;
  --sidebar-bg:    #FFFFFF;
  --border:        #DEDEDE;
  --border2:       #E8E8E8;
  --text:          #1A1A1A;
  --text2:         #585858;
  --text3:         #888888;
  --card-bg:       #FFFFFF;
  --card-hover:    #F5F5F5;
  --header-bg:     #FFFFFF;
  --shadow:        rgba(0,0,0,0.06);
  --shadow2:       rgba(0,0,0,0.12);
  --accent:        #FF5000;
  --accent-light:  rgba(255,80,0,0.08);
  --accent-mid:    rgba(255,80,0,0.15);
  --phone-color:   #1A7A3C;
  --phone-bg:      rgba(26,122,60,0.07);
  --email-color:   #0057A8;
  --email-bg:      rgba(0,87,168,0.07);
  --badge-text:    #FFFFFF;
  --section-bg:    #F2F2F2;
  --input-bg:      #F7F7F7;
  --pill-bg:       #F0F0F0;
  --pill-text:     #585858;
  --active-row:    rgba(255,80,0,0.04);
  --mark-bg:       rgba(242,169,0,0.35);
}

[data-theme="dark"] {
  --bg:            #111111;
  --bg2:           #1C1C1C;
  --bg3:           #252525;
  --sidebar-bg:    #161616;
  --border:        #2E2E2E;
  --border2:       #282828;
  --text:          #F0F0F0;
  --text2:         #AAAAAA;
  --text3:         #666666;
  --card-bg:       #1C1C1C;
  --card-hover:    #242424;
  --header-bg:     #141414;
  --shadow:        rgba(0,0,0,0.3);
  --shadow2:       rgba(0,0,0,0.5);
  --accent:        #FF5000;
  --accent-light:  rgba(255,80,0,0.1);
  --accent-mid:    rgba(255,80,0,0.2);
  --phone-color:   #4DCC7A;
  --phone-bg:      rgba(77,204,122,0.08);
  --email-color:   #5AB3E8;
  --email-bg:      rgba(90,179,232,0.08);
  --badge-text:    #FFFFFF;
  --section-bg:    #1F1F1F;
  --input-bg:      #1C1C1C;
  --pill-bg:       #252525;
  --pill-text:     #AAAAAA;
  --active-row:    rgba(255,80,0,0.06);
  --mark-bg:       rgba(242,169,0,0.3);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Neue Haas Unica', 'Haas Unica', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  font-size: 14px;
  transition: background 0.2s, color 0.2s;
}

/* ── HEADER ──────────────────────────────────────────────────────── */
header {
  background: var(--header-bg);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  height: 56px;
  display: flex;
  align-items: center;
  gap: 14px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 1px 4px var(--shadow);
}

.header-logo {
  width: 32px;
  height: 32px;
  flex-shrink: 0;
}

.header-divider {
  width: 1px;
  height: 28px;
  background: var(--border);
  flex-shrink: 0;
}

.header-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.2px;
}

.header-subtitle {
  font-size: 11px;
  color: var(--text3);
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-top: 1px;
}

.header-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
}

.stat-chip {
  background: var(--pill-bg);
  color: var(--text2);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 500;
  border: 1px solid var(--border);
}

.stat-chip span { color: var(--accent); font-weight: 700; }

.theme-toggle {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--pill-bg);
  color: var(--text2);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}
.theme-toggle:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

/* ── LAYOUT ──────────────────────────────────────────────────────── */
.app {
  display: grid;
  grid-template-columns: 288px 1fr;
  height: calc(100vh - 56px);
}

/* ── SIDEBAR ─────────────────────────────────────────────────────── */
.sidebar {
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.search-wrap {
  padding: 12px 12px 0;
}

.search-box {
  position: relative;
}

.search-box input {
  width: 100%;
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 9px 32px 9px 34px;
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}

.search-box input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-light);
}

.search-box input::placeholder { color: var(--text3); }

.search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text3);
  font-size: 13px;
  pointer-events: none;
}

.search-clear {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--text3);
  font-size: 14px;
  cursor: pointer;
  padding: 2px 4px;
  border-radius: 4px;
  display: none;
  line-height: 1;
}
.search-clear:hover { color: var(--text); }
.search-clear.visible { display: block; }

.filter-tabs {
  display: flex;
  gap: 4px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
}

.filter-tab {
  flex: 1;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 2px;
  font-size: 11px;
  font-weight: 500;
  color: var(--text2);
  cursor: pointer;
  font-family: inherit;
  transition: all 0.12s;
  text-align: center;
  white-space: nowrap;
}

.filter-tab.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.filter-tab:hover:not(.active) {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-light);
}

.org-count {
  padding: 6px 14px 2px;
  font-size: 11px;
  color: var(--text3);
  font-weight: 500;
}

.org-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 8px 12px;
}

.org-list::-webkit-scrollbar { width: 3px; }
.org-list::-webkit-scrollbar-track { background: transparent; }
.org-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ── ORG LIST ITEMS ──────────────────────────────────────────────── */
.org-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 9px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.12s;
  margin-bottom: 1px;
  border: 1px solid transparent;
}

.org-item:hover { background: var(--card-hover); }

.org-item.active {
  background: var(--accent-light);
  border-color: rgba(255,80,0,0.25);
}

.org-badge {
  width: 34px;
  height: 34px;
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
  flex-shrink: 0;
  letter-spacing: 0;
  color: #fff;
}

.org-badge-logo {
  overflow: hidden;
  padding: 3px;
}

.badge-favicon {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  border-radius: 3px;
}

.org-info { flex: 1; min-width: 0; }

.org-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.org-meta { font-size: 11px; color: var(--text3); margin-top: 1px; }
.org-cnt { font-size: 11px; color: var(--text3); font-weight: 600; flex-shrink: 0; }

/* ── SEARCH RESULTS PANEL ────────────────────────────────────────── */
.search-results-panel {
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.search-results-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 6px 8px 12px;
}

.search-results-scroll::-webkit-scrollbar { width: 3px; }
.search-results-scroll::-webkit-scrollbar-track { background: transparent; }
.search-results-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.sr-section-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--text3);
  padding: 12px 8px 5px;
}

.sr-section-label:first-child { padding-top: 4px; }

.sr-org-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 9px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.12s;
  border: 1px solid transparent;
  margin-bottom: 1px;
}

.sr-org-item:hover { background: var(--card-hover); border-color: var(--border); }

.sr-person-item {
  padding: 9px 10px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.12s;
  border: 1px solid transparent;
  margin-bottom: 3px;
}

.sr-person-item:hover { background: var(--card-hover); border-color: var(--border); }

.sr-person-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px; }
.sr-person-name { font-size: 13px; font-weight: 600; color: var(--text); }
.sr-person-title { font-size: 11px; color: var(--text3); }
.sr-person-org { font-size: 11px; font-weight: 600; color: var(--accent); margin-bottom: 4px; }

.sr-person-links { display: flex; gap: 6px; flex-wrap: wrap; }

.sr-link {
  font-size: 11px;
  text-decoration: none;
  padding: 2px 8px;
  border-radius: 4px;
  white-space: nowrap;
  max-width: 200px;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sr-link-phone { color: var(--phone-color); background: var(--phone-bg); }
.sr-link-phone:hover { opacity: 0.8; }
.sr-link-email { color: var(--email-color); background: var(--email-bg); }
.sr-link-email:hover { opacity: 0.8; }

.sr-no-results { text-align: center; padding: 32px 16px; color: var(--text3); font-size: 13px; }

mark { background: var(--mark-bg); color: inherit; border-radius: 2px; padding: 0 1px; }

/* ── ADD ORG BUTTON ──────────────────────────────────────────────── */
.add-org-btn {
  margin: 6px 8px 8px;
  padding: 8px;
  background: transparent;
  border: 1px dashed var(--border);
  border-radius: 8px;
  color: var(--text3);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
  text-align: center;
}
.add-org-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

/* ── MAIN PANEL ──────────────────────────────────────────────────── */
.main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}

/* ── DETAIL PANEL ────────────────────────────────────────────────── */
.detail-panel {
  display: flex;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
}

/* ── WELCOME ─────────────────────────────────────────────────────── */
.welcome-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 12px;
  color: var(--text3);
}

.welcome-logo { width: 64px; height: 64px; opacity: 0.15; }
.welcome-state h2 { font-size: 16px; font-weight: 500; color: var(--text2); }
.welcome-state p { font-size: 13px; color: var(--text3); }

/* ── ORG DETAIL HEADER ───────────────────────────────────────────── */
.detail-header {
  padding: 18px 24px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
}

.detail-header-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 12px;
}

.detail-org-name {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.3px;
  line-height: 1.2;
}

.detail-type-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  padding: 2px 9px;
  border-radius: 10px;
  margin-top: 5px;
}

.type-airline  { background: rgba(62,177,200,0.12); color: #1A7A8A; border: 1px solid rgba(62,177,200,0.3); }
.type-handler  { background: rgba(242,169,0,0.12); color: #A07000; border: 1px solid rgba(242,169,0,0.3); }
.type-cargo    { background: rgba(65,57,95,0.1);   color: #41395F; border: 1px solid rgba(65,57,95,0.25); }
.type-airport  { background: rgba(255,80,0,0.08);  color: #CC3D00; border: 1px solid rgba(255,80,0,0.25); }

[data-theme="dark"] .type-airline  { color: #3EB1C8; }
[data-theme="dark"] .type-handler  { color: #F2A900; }
[data-theme="dark"] .type-cargo    { color: #9B94C5; }
[data-theme="dark"] .type-airport  { color: #FF7A40; }

.primary-contacts { display: flex; gap: 8px; flex-wrap: wrap; }

.primary-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: 7px;
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
  transition: all 0.12s;
  border: 1px solid;
}

.primary-btn-phone {
  color: var(--phone-color);
  background: var(--phone-bg);
  border-color: rgba(26,122,60,0.2);
}
.primary-btn-phone:hover { opacity: 0.8; }

.primary-btn-email {
  color: var(--email-color);
  background: var(--email-bg);
  border-color: rgba(0,87,168,0.2);
}
.primary-btn-email:hover { opacity: 0.8; }

/* ── CONTACTS TABLE ──────────────────────────────────────────────── */
.detail-body {
  flex: 1;
  overflow-y: auto;
  padding: 0 0 20px;
}

.detail-body::-webkit-scrollbar { width: 4px; }
.detail-body::-webkit-scrollbar-track { background: transparent; }
.detail-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Airline color banner strip at top of detail body */
.airline-color-strip {
  height: 4px;
  width: 100%;
  flex-shrink: 0;
}

.section-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text3);
  padding: 16px 24px 6px;
  border-bottom: 1px solid var(--border2);
}

.contact-row {
  display: grid;
  grid-template-columns: 200px 150px 1fr 180px 80px 64px;
  gap: 8px;
  align-items: center;
  padding: 8px 24px;
  border-bottom: 1px solid var(--border2);
  transition: background 0.1s;
}

.contact-row:hover { background: var(--card-hover); }
.contact-row:last-of-type { border-bottom: none; }

.contact-name { font-size: 13px; font-weight: 500; color: var(--text); }
.contact-title { font-size: 11px; color: var(--text3); margin-top: 1px; }

.contact-phone a {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  text-decoration: none;
  color: var(--phone-color);
  font-size: 12px;
  font-weight: 500;
  padding: 3px 8px;
  border-radius: 5px;
  background: var(--phone-bg);
  transition: opacity 0.1s;
  white-space: nowrap;
}
.contact-phone a:hover { opacity: 0.8; }
.contact-phone .no-val { color: var(--text3); font-size: 12px; padding: 3px 8px; }

.contact-email a {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  text-decoration: none;
  color: var(--email-color);
  font-size: 12px;
  font-weight: 500;
  padding: 3px 8px;
  border-radius: 5px;
  background: var(--email-bg);
  transition: opacity 0.1s;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 260px;
}
.contact-email a:hover { opacity: 0.8; }
.contact-email .no-val { color: var(--text3); font-size: 12px; padding: 3px 8px; }

.contact-actions {
  display: flex;
  align-items: center;
  gap: 4px;
  opacity: 0;
  transition: opacity 0.15s;
}
.contact-row:hover .contact-actions { opacity: 1; }

.icon-btn {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 5px;
  width: 26px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text3);
  font-size: 12px;
  transition: all 0.12s;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
.icon-btn.del:hover { border-color: #E53935; color: #E53935; background: rgba(229,57,53,0.06); }

.contact-notes-cell { font-size: 11px; color: var(--text3); font-style: italic; line-height: 1.4; word-break: break-word; }

/* Distro list */
.distro-dot {
  display: inline-block;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--dfw-blue);
  margin-left: 5px;
  vertical-align: middle;
  flex-shrink: 0;
  title: "On distro list";
}
.distro-toggle-label {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  cursor: pointer;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--input-bg);
  transition: border-color 0.15s, background 0.15s;
}
.distro-toggle-label:has(input:checked) {
  border-color: var(--dfw-blue);
  background: rgba(62,177,200,0.07);
}
.distro-toggle-label input[type=checkbox] { margin-top: 2px; accent-color: var(--dfw-blue); flex-shrink: 0; }
.distro-toggle-text { font-size: 13px; font-weight: 600; color: var(--text); }
.distro-toggle-sub { font-size: 11px; color: var(--text3); display: block; margin-top: 2px; }
.distro-toggle-text, .distro-toggle-sub { display: block; }
.distro-toggle-label > div { display: flex; flex-direction: column; }

.email-distro-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  background: rgba(62,177,200,0.1);
  border: 1px solid rgba(62,177,200,0.35);
  border-radius: 7px;
  color: var(--dfw-blue);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.15s;
  font-family: inherit;
  white-space: nowrap;
}
.email-distro-btn:hover { background: rgba(62,177,200,0.18); border-color: var(--dfw-blue); }
.email-distro-btn.disabled { opacity: 0.4; cursor: default; pointer-events: none; }
.distro-count-badge {
  background: var(--dfw-blue);
  color: #fff;
  border-radius: 10px;
  padding: 1px 6px;
  font-size: 10px;
  font-weight: 700;
}

/* Operational Notes section */
.op-notes-section {
  margin: 0;
  padding: 16px 24px;
  border-top: 1px solid var(--border2);
  background: var(--section-bg);
}
.op-notes-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--text3);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.op-notes-label span { color: var(--dfw-orange); }
.op-notes-textarea {
  width: 100%;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  font-family: inherit;
  font-size: 12px;
  color: var(--text);
  resize: vertical;
  min-height: 72px;
  line-height: 1.5;
  transition: border-color 0.15s;
}
.op-notes-textarea:focus { outline: none; border-color: var(--accent); }
.op-notes-textarea::placeholder { color: var(--text3); }

/* Contact table column header */
.contact-table-header {
  display: grid;
  grid-template-columns: 200px 150px 1fr 180px 80px 64px;
  gap: 8px;
  padding: 6px 24px;
  background: var(--section-bg);
  border-bottom: 1px solid var(--border2);
}
.contact-table-header span {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text3);
}

.add-contact-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 24px;
  background: transparent;
  border: none;
  border-top: 1px dashed var(--border);
  color: var(--text3);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.12s;
  width: 100%;
  text-align: left;
  margin-top: 4px;
}
.add-contact-btn:hover { color: var(--accent); background: var(--accent-light); }

.no-results { text-align: center; padding: 40px 24px; color: var(--text3); font-size: 13px; }

/* ── HEADER ACTION BUTTONS ───────────────────────────────────────── */
.action-row { display: flex; align-items: center; gap: 6px; }

.hdr-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 12px;
  border-radius: 7px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.12s;
  border: 1px solid var(--border);
  background: var(--bg2);
  color: var(--text2);
}
.hdr-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
.hdr-btn.del:hover { border-color: #E53935; color: #E53935; background: rgba(229,57,53,0.06); }

/* ── MODALS ──────────────────────────────────────────────────────── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 200;
  align-items: center;
  justify-content: center;
}
.modal-overlay.open { display: flex; }

.modal {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  width: 520px;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px var(--shadow2);
}

.modal h3 {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 18px;
  letter-spacing: -0.2px;
}

.modal h3 span { color: var(--accent); }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }

.form-group { display: flex; flex-direction: column; gap: 4px; }

.form-group label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.8px;
}

.form-group input,
.form-group select,
.form-group textarea {
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 8px 11px;
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  outline: none;
  transition: border-color 0.12s, box-shadow 0.12s;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-light);
}

.form-group textarea { resize: vertical; }
.form-group select { cursor: pointer; }
.form-group select option { background: var(--bg2); }

.modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
}

.btn {
  padding: 8px 18px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.12s;
  border: none;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #E04600; }
.btn-danger { background: rgba(229,57,53,0.08); border: 1px solid rgba(229,57,53,0.3); color: #E53935; }
.btn-danger:hover { background: rgba(229,57,53,0.15); }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text2); }
.btn-ghost:hover { border-color: var(--text2); }

/* ── CONFIRM ─────────────────────────────────────────────────────── */
.confirm-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 300;
  align-items: center;
  justify-content: center;
}
.confirm-overlay.open { display: flex; }

.confirm-box {
  background: var(--bg2);
  border: 1px solid rgba(229,57,53,0.4);
  border-radius: 10px;
  padding: 22px;
  width: 340px;
  text-align: center;
  box-shadow: 0 20px 60px var(--shadow2);
}
.confirm-box h3 { font-size: 15px; font-weight: 700; color: #E53935; margin-bottom: 8px; }
.confirm-box p { font-size: 13px; color: var(--text2); margin-bottom: 18px; }
.confirm-actions { display: flex; gap: 8px; justify-content: center; }

/* ── TOAST ───────────────────────────────────────────────────────── */
.save-toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #1A7A3C;
  color: #fff;
  padding: 9px 18px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  display: none;
  z-index: 400;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  animation: toastIn 0.2s ease;
}

@keyframes toastIn {
  from { transform: translateY(8px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@media (max-width: 900px) {
  .contact-row { grid-template-columns: 1fr 1fr; }
  .contact-table-header { grid-template-columns: 1fr 1fr; }
}

.distro-inline-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.distro-inline-toggle input[type=checkbox] {
  width: 16px;
  height: 16px;
  accent-color: var(--dfw-blue);
  cursor: pointer;
}
.distro-inline-toggle input[type=checkbox]:disabled {
  cursor: not-allowed;
  opacity: 0.35;
}
.distro-inline-toggle.no-email::after {
  content: '⚠';
  font-size: 10px;
  color: var(--text3);
  margin-left: 3px;
}
/* CSS tooltip */
.distro-inline-toggle[data-tooltip]:hover::before {
  content: attr(data-tooltip);
  position: absolute;
  bottom: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--dfw-dgray);
  color: #fff;
  font-size: 11px;
  white-space: nowrap;
  padding: 4px 8px;
  border-radius: 5px;
  pointer-events: none;
  z-index: 50;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}
.distro-inline-toggle[data-tooltip]:hover::after {
  content: '';
  position: absolute;
  bottom: calc(100% + 1px);
  left: 50%;
  transform: translateX(-50%);
  border: 5px solid transparent;
  border-top-color: var(--dfw-dgray);
  pointer-events: none;
  z-index: 50;
}
</style>
</head>

function getFaviconDomain(orgName, sheet) {
  const code = sheet ? sheet.replace(/\s.*/, '') : '';
  if (FAVICON_DOMAINS[code]) return FAVICON_DOMAINS[code];
  // Try full sheet name for handlers
  if (sheet && FAVICON_DOMAINS[sheet]) return FAVICON_DOMAINS[sheet];
  // Try extracting code from org name
  const m = orgName.match(/\(([A-Z0-9]{1,3})\)/);
  if (m && FAVICON_DOMAINS[m[1]]) return FAVICON_DOMAINS[m[1]];
  return null;
}

function faviconUrl(domain) {
  return 'https://www.google.com/s2/favicons?sz=64&domain=' + domain;
}

// Badge HTML builder — shows favicon if available, falls back to color+code
function makeBadgeHTML(orgName, sheet, orgType) {
  const domain = getFaviconDomain(orgName, sheet);
  const code = getCodeLabel(orgName, sheet);
  const color = getAirlineColor(orgName, sheet) ||
    (orgType === 'handler' ? '#41395F' : orgType === 'cargo' ? '#585858' : orgType === 'airport' ? '#FF5000' : '#3EB1C8');
  const fg = getContrastColor(color);

  if (domain) {
    // White badge with favicon image; falls back to letter code if img errors
    return `<div class="org-badge org-badge-logo" style="background:#fff;border:1px solid #E0E0E0;">` +
      `<img src="${faviconUrl(domain)}" alt="${code}" class="badge-favicon" ` +
      `onerror="this.parentElement.innerHTML='<span style=\\'color:${fg}\\'>${code}</span>';this.parentElement.style.background='${color}';this.parentElement.style.border='none';">` +
      `</div>`;
  }
  return `<div class="org-badge" style="background:${color};color:${fg}">${code}</div>`;
}

function getAirlineColor(orgName, sheet) {
  // Try sheet code first
  const code = sheet ? sheet.replace(/\s.*/, '') : '';
  if (AIRLINE_COLORS[code]) return AIRLINE_COLORS[code];
  // Try extracting code from name e.g. "American Airlines (AA)"
  const m = orgName.match(/\(([A-Z0-9]{1,3})\)/);
  if (m && AIRLINE_COLORS[m[1]]) return AIRLINE_COLORS[m[1]];
  return null;
}

function getContrastColor(hex) {
  // Returns black or white depending on bg lightness
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
  return lum > 0.5 ? '#1A1A1A' : '#FFFFFF';
}

const GH_USER    = 'bsapit';
const GH_REPO    = 'dfw-phonebook';
const GH_FILE    = 'phonebook.json';
const GH_TOKEN   = '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';
const GH_API     = 'https://api.github.com/repos/' + GH_USER + '/' + GH_REPO + '/contents/' + GH_FILE;
const GH_HEADERS = {
  'Authorization': 'token ' + GH_TOKEN,
  'Accept': 'application/vnd.github.v3+json',
  'Content-Type': 'application/json'
};
let ghFileSha = null; // tracks current file SHA for updates
const CACHE_KEY   = 'dfwPhonebook_v2';
const CACHE_TS    = 'dfwPhonebook_v2_ts';
const CACHE_TTL   = 60 * 60 * 1000; // 1 hour

// ── STATE ─────────────────────────────────────────────────────────────────────
let data = JSON.parse(JSON.stringify(RAW_DATA));
let currentFilter = 'all';
let currentOrgIdx = -1;
let editingContactIdx = -1;
let editingOrgMode = false;
let pendingDeleteType = '';
let pendingDeleteIdx = -1;
let saveTimer = null;

// ── SANITIZE ──────────────────────────────────────────────────────────────────
function sanitize(arr) {
  if (!Array.isArray(arr)) return RAW_DATA;
  return arr.map(o => ({
    ...o,
    name: o.name || '',
    contacts: Array.isArray(o.contacts) ? o.contacts : []
  }));
}

// ── CACHE ─────────────────────────────────────────────────────────────────────
function saveToCache(d) {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify(d));
    localStorage.setItem(CACHE_TS, Date.now().toString());
  } catch(e) {}
}

function loadFromCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

function cacheIsStale() {
  try {
    const ts = parseInt(localStorage.getItem(CACHE_TS) || '0', 10);
    return (Date.now() - ts) > CACHE_TTL;
  } catch(e) { return true; }
}

// ── SPINNER ───────────────────────────────────────────────────────────────────
function showSpinner() {
  const ws = document.getElementById('welcomeState');
  if (ws) ws.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--text3)"><div style="font-size:28px;animation:spin 1s linear infinite">⏳</div><div style="font-size:14px">Loading from cloud…</div></div>';
}

// ── APPLY DATA ────────────────────────────────────────────────────────────────
function applyData(d) {
  data = sanitize(d);
  renderOrgList();
  updateStats();
  if (currentOrgIdx >= 0 && currentOrgIdx < data.length) renderDetail();
  else { currentOrgIdx = -1; renderDetail(); }
}

// ── LOAD FROM CLOUD ───────────────────────────────────────────────────────────
async function loadFromCloud() {
  try {
    const res = await fetch(GH_API, { headers: GH_HEADERS });
    if (res.status === 404) {
      // File doesn't exist yet — create it directly (no SHA needed for new files)
      console.log('No phonebook.json found in GitHub, creating from RAW_DATA…');
      const createRes = await fetch(GH_API, {
        method: 'PUT',
        headers: GH_HEADERS,
        body: JSON.stringify({
          message: 'Initialize phonebook',
          content: btoa(unescape(encodeURIComponent(JSON.stringify(data))))
        })
      });
      if (!createRes.ok) {
        const errText = await createRes.text().catch(() => '');
        console.warn('GitHub seed failed:', errText);
        return;
      }
      const createJson = await createRes.json();
      ghFileSha = createJson.content.sha;
      saveToCache(data);
      return;
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    ghFileSha = json.sha;
    const fetched = JSON.parse(atob(json.content.replace(/\n/g, '')));
    if (Array.isArray(fetched) && fetched.length > 0) {
      saveToCache(fetched);
      applyData(fetched);
    }
  } catch(e) {
    console.warn('GitHub fetch failed, using cache/RAW_DATA:', e);
  }
}

// ── SAVE TO CLOUD ─────────────────────────────────────────────────────────────
async function saveToCloud() {
  updateSaveToast('saving');
  try {
    // If we don't have the SHA yet (e.g. loaded from cache), fetch it first
    if (!ghFileSha) {
      const check = await fetch(GH_API, { headers: GH_HEADERS });
      if (check.ok) {
        const checkJson = await check.json();
        ghFileSha = checkJson.sha;
      }
      // If 404, the file doesn't exist yet — SHA stays null and GitHub will create it
    }
    const body = {
      message: 'Update phonebook',
      content: btoa(unescape(encodeURIComponent(JSON.stringify(data)))),
    };
    if (ghFileSha) body.sha = ghFileSha;
    const res = await fetch(GH_API, {
      method: 'PUT',
      headers: GH_HEADERS,
      body: JSON.stringify(body)
    });
    if (!res.ok) {
      const errText = await res.text().catch(() => '');
      throw new Error('HTTP ' + res.status + (errText ? ': ' + errText : ''));
    }
    const json = await res.json();
    ghFileSha = json.content.sha; // update SHA for next save
    saveToCache(data);
    updateSaveToast('saved');
  } catch(e) {
    console.error('GitHub save failed:', e);
    updateSaveToast('error', e.message);
  }
}

// ── DEBOUNCED SAVE ────────────────────────────────────────────────────────────
function save() {
  if (saveTimer) clearTimeout(saveTimer);
  updateSaveToast('pending');
  saveTimer = setTimeout(() => { saveToCloud(); }, 5000);
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
function updateSaveToast(state) {
  const t = document.getElementById('saveToast');
  if (state === 'pending') {
    t.textContent = '⏳ Saving in 5s…';
    t.style.display = 'block';
    t.style.background = '#A07000';
  } else if (state === 'saving') {
    t.textContent = '⏳ Saving…';
    t.style.display = 'block';
    t.style.background = '#A07000';
  } else if (state === 'saved') {
    t.textContent = '✓ Saved';
    t.style.background = '#1A7A3C';
    setTimeout(() => t.style.display = 'none', 2000);
  } else if (state === 'error') {
    t.textContent = '⚠ Save failed' + (arguments[1] ? ' — ' + arguments[1] : '');
    t.style.background = '#C62828';
    t.title = arguments[1] || '';
    setTimeout(() => t.style.display = 'none', 6000);
  }
}

function showToast() { /* legacy no-op — save() now handles toasts */ }

// ── INIT: LOAD DATA ───────────────────────────────────────────────────────────
(function () {
  const cached = loadFromCache();
  if (cached && cached.length > 0) {
    applyData(cached);   // instant render from cache while fresh data loads
  } else {
    showSpinner();
  }
  loadFromCloud();       // always fetch latest from GitHub on every page load
  // Poll GitHub every 30s so open tabs stay in sync with changes from other machines
  setInterval(() => { if (!saveTimer) loadFromCloud(); }, 300000);
})();

// ── ORG LIST ──────────────────────────────────────────────────────────────────
function getCodeLabel(name, sheet) {
  const s = sheet || '';
  const m = s.match(/^([A-Z0-9]{1,4})/);
  if (m) return m[1];
  const n = name.match(/\(([A-Z0-9]{1,4})\)/);
  if (n) return n[1];
  return name.substring(0,3).toUpperCase();
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderOrgList();
}

function clearSearch() {
  document.getElementById('orgSearch').value = '';
  handleSearch();
  document.getElementById('orgSearch').focus();
}

function handleSearch() {
  const q = document.getElementById('orgSearch').value.trim();
  const clearBtn = document.getElementById('searchClear');
  const orgList = document.getElementById('orgList');
  const srPanel = document.getElementById('searchResultsPanel');
  const filterTabs = document.getElementById('filterTabs');
  const countEl = document.getElementById('orgCount');

  if (!q) {
    clearBtn.classList.remove('visible');
    orgList.style.display = 'block';
    srPanel.style.display = 'none';
    filterTabs.style.display = 'flex';
    renderOrgList();
    return;
  }

  clearBtn.classList.add('visible');
  orgList.style.display = 'none';
  srPanel.style.display = 'flex';
  filterTabs.style.display = 'none';
  countEl.textContent = '';
  renderUnifiedSearch(q);
}

function hl(text, q) {
  if (!text || !q) return text || '';
  const esc = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp('(' + esc + ')', 'gi'), '<mark>$1</mark>');
}

function renderUnifiedSearch(q) {
  const ql = q.toLowerCase();
  const scroll = document.getElementById('searchResultsScroll');

  const orgMatches = data.filter(o => o.name.toLowerCase().includes(ql));
  const personMatches = [];
  data.forEach(org => {
    org.contacts.forEach((c, ci) => {
      const hay = [c.name, c.title, c.email, c.phone, c.notes].join(' ').toLowerCase();
      if (hay.includes(ql)) personMatches.push({...c, _orgName: org.name, _orgIdx: data.indexOf(org), _ci: ci});
    });
  });

  let html = '';

  if (!orgMatches.length && !personMatches.length) {
    scroll.innerHTML = '<div class="sr-no-results">No results for &ldquo;' + q + '&rdquo;</div>';
    return;
  }

  const total = orgMatches.length + personMatches.length;
  html += '<div class="sr-section-label">' + total + ' result' + (total!==1?'s':'') + ' for &ldquo;' + q + '&rdquo;</div>';

  if (orgMatches.length) {
    html += '<div class="sr-section-label">Organizations (' + orgMatches.length + ')</div>';
    orgMatches.forEach(o => {
      const idx = data.indexOf(o);
      html += '<div class="sr-org-item" onclick="selectFromSearch('+idx+')">';
      html += makeBadgeHTML(o.name, o.sheet, o.type);
      html += '<div class="org-info"><div class="org-name">'+hl(o.name,q)+'</div>';
      html += '<div class="org-meta">'+( o.primary_phone ? '📞 '+o.primary_phone : 'No primary phone')+' · '+o.contacts.length+' contacts</div></div></div>';
    });
  }

  if (personMatches.length) {
    html += '<div class="sr-section-label">People (' + personMatches.length + ')</div>';
    personMatches.forEach(c => {
      const dn = c.name || c.title || '—';
      const dt = c.name && c.title ? c.title : '';
      const ph = c.phone ? c.phone.replace(/[^\d+]/g,'') : '';
      html += '<div class="sr-person-item" onclick="selectFromSearch('+c._orgIdx+')">';
      html += '<div class="sr-person-top"><span class="sr-person-name">'+hl(dn,q)+'</span>';
      if (dt) html += '<span class="sr-person-title">'+hl(dt,q)+'</span>';
      html += '</div><div class="sr-person-org">'+c._orgName+'</div><div class="sr-person-links">';
      if (c.phone) html += '<a class="sr-link sr-link-phone" href="tel:'+ph+'" onclick="event.stopPropagation()">📞 '+hl(c.phone,q)+'</a>';
      if (c.email) html += '<a class="sr-link sr-link-email" href="mailto:'+c.email+'" onclick="event.stopPropagation()">✉ '+hl(c.email,q)+'</a>';
      if (c.notes) html += '<span style="font-size:11px;color:var(--text3);font-style:italic;">'+hl(c.notes,q)+'</span>';
      html += '</div></div>';
    });
  }

  scroll.innerHTML = html;
}

function renderOrgList() {
  const q = document.getElementById('orgSearch').value.toLowerCase();
  const list = document.getElementById('orgList');
  const filtered = data.filter(o => {
    const typeMatch = currentFilter === 'all' || o.type === currentFilter;
    const nameMatch = !q || o.name.toLowerCase().includes(q);
    return typeMatch && nameMatch;
  }).sort((a, b) => a.name.localeCompare(b.name));

  document.getElementById('orgCount').textContent = filtered.length + ' of ' + data.length;

  list.innerHTML = filtered.map(o => {
    const idx = data.indexOf(o);
    const active = idx === currentOrgIdx ? ' active' : '';
    return '<div class="org-item'+active+'" onclick="selectOrg('+idx+')">' +
      makeBadgeHTML(o.name, o.sheet, o.type) +
      '<div class="org-info"><div class="org-name">'+o.name+'</div>' +
      '<div class="org-meta">'+( o.primary_phone || 'No primary phone')+'</div></div>' +
      '<div class="org-cnt">'+o.contacts.length+'</div></div>';
  }).join('');
}

// ── SELECT ORG ────────────────────────────────────────────────────────────────
function selectFromSearch(idx) {
  // Set the org and render detail FIRST, then clear the search
  currentOrgIdx = idx;
  renderDetail();
  // Now clear search — this re-renders org list with correct active state
  document.getElementById('orgSearch').value = '';
  document.getElementById('searchClear').classList.remove('visible');
  document.getElementById('orgList').style.display = 'block';
  document.getElementById('searchResultsPanel').style.display = 'none';
  document.getElementById('filterTabs').style.display = 'flex';
  renderOrgList();
}

function selectOrg(idx) {
  currentOrgIdx = idx;
  renderOrgList();
  renderDetail();
}

function renderDetail() {
  const ws = document.getElementById('welcomeState');
  const od = document.getElementById('orgDetail');

  if (currentOrgIdx < 0) {
    ws.style.display = 'flex'; od.style.display = 'none'; return;
  }

  ws.style.display = 'none'; od.style.display = 'flex';

  const org = data[currentOrgIdx];
  document.getElementById('detailOrgName').textContent = org.name;

  const badge = document.getElementById('detailTypeBadge');
  badge.textContent = {airline:'✈ Airline', handler:'🔧 Ground Handler', cargo:'📦 Cargo', airport:'🏢 Airport'}[org.type] || org.type;
  badge.className = 'detail-type-badge type-' + org.type;

  // Airline color strip
  const strip = document.getElementById('airlineColorStrip');
  const ac = getAirlineColor(org.name, org.sheet);
  strip.style.background = ac || 'transparent';
  strip.style.height = ac ? '4px' : '0';

  // Primary contacts
  const pc = document.getElementById('primaryContacts');
  let pcHTML = '';
  if (org.primary_phone) {
    const ph = org.primary_phone.replace(/[^\d+]/g,'');
    pcHTML += '<a href="tel:'+ph+'" class="primary-btn primary-btn-phone">📞 '+org.primary_phone+'</a>';
  }
  if (org.primary_email) {
    pcHTML += '<a href="mailto:'+org.primary_email+'" class="primary-btn primary-btn-email">✉ '+org.primary_email+'</a>';
  }
  if (!pcHTML) pcHTML = '<span style="color:var(--text3);font-size:12px;">No primary contact set</span>';
  pc.innerHTML = pcHTML;

  // Contacts
  const body = document.getElementById('detailBody');
  if (!org.contacts.length) {
    body.innerHTML = '<div class="no-results">No contacts added yet.</div>';
  } else {
    const sections = {};
    org.contacts.forEach((c, i) => {
      const sec = c.section || '';
      if (!sections[sec]) sections[sec] = [];
      sections[sec].push({...c, _idx: i});
    });

    const SECTION_ORDER = ['Managers','Supervisors','Operations','Agents','Above Wing','Below Wing'];
    const sortedSectionKeys = Object.keys(sections).sort((a, b) => {
      const ai = SECTION_ORDER.indexOf(a);
      const bi = SECTION_ORDER.indexOf(b);
      if (ai !== -1 && bi !== -1) return ai - bi;
      if (ai !== -1) return -1;
      if (bi !== -1) return 1;
      if (!a) return -1; // unsectioned contacts float to top only if both are unrecognized
      if (!b) return 1;
      return a.localeCompare(b);
    });

    let html = '<div class="contact-table-header"><span>Name / Title</span><span>Phone</span><span>Email</span><span>Notes</span><span style="text-align:center;">📧 Distro</span><span></span></div>';
    sortedSectionKeys.forEach(sec => {
      const contacts = sections[sec];
      if (sec) html += '<div class="section-label">' + sec + '</div>';
      contacts.forEach(c => {
        const dn = c.name || c.title || '—';
        const dt = c.name ? c.title : '';
        const ph = c.phone ? c.phone.replace(/[^\d+]/g,'') : '';
        html += '<div class="contact-row">';
        html += '<div><div class="contact-name">'+dn+'</div>' + (dt ? '<div class="contact-title">'+dt+'</div>' : '')+'</div>';
        html += '<div class="contact-phone">' + (c.phone ? '<a href="tel:'+ph+'">📞 '+c.phone+'</a>' : '<span class="no-val">—</span>') + '</div>';
        html += '<div class="contact-email">' + (c.email ? '<a href="mailto:'+c.email+'">✉ '+c.email+'</a>' : '<span class="no-val">—</span>') + '</div>';
        html += '<div class="contact-notes-cell">' + (c.notes ? c.notes : '<span style="color:var(--border)">—</span>') + '</div>';
        const hasEmail = !!c.email;
        const distroChecked = c.distro && hasEmail ? 'checked' : '';
        const distroDisabled = !hasEmail ? 'disabled' : '';
        const distroTitle = hasEmail ? 'Add to distro list' : 'No email address — cannot add to distro';
        html += '<div class="distro-inline-toggle' + (!hasEmail ? ' no-email' : '') + '" data-tooltip="' + distroTitle + '"><input type="checkbox" ' + distroChecked + ' ' + distroDisabled + ' onchange="toggleDistro('+c._idx+', this.checked)"></div>';
        html += '<div class="contact-actions"><button class="icon-btn" onclick="openEditContact('+c._idx+')">✏️</button><button class="icon-btn del" onclick="confirmDeleteContact('+c._idx+')">🗑️</button></div>';
        html += '</div>';
      });
    });
    body.innerHTML = html;
  }
  body.innerHTML += '<button class="add-contact-btn" onclick="openAddContact()">+ Add Contact</button>';

  // Update distro button
  const distroEmails = (org.contacts || []).filter(c => c.distro && c.email).map(c => c.email);
  const btn = document.getElementById('emailDistroBtn');
  const distroBadge = document.getElementById('distroCountBadge');
  distroBadge.textContent = distroEmails.length;
  if (distroEmails.length > 0) {
    btn.classList.remove('disabled');
  } else {
    btn.classList.add('disabled');
  }

  // Operational Notes section
  const opNotes = document.getElementById('opNotesSection');
  opNotes.innerHTML = '<div class="op-notes-label"><span>📋</span> Operational Notes</div>' +
    '<textarea class="op-notes-textarea" id="opNotesText" placeholder="Add operational notes for this organization..." oninput="saveOpNotes()">' +
    (org.op_notes ? org.op_notes.replace(/</g,'&lt;').replace(/>/g,'&gt;') : '') + '</textarea>';
}

// ── MODALS ────────────────────────────────────────────────────────────────────
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

const SECTION_OPTIONS = ['Above Wing','Agent','Below Wing','Catering','Deicing','Fueler','Managers','MX Provider','Operations','Supervisors'];

function handleSectionSelect(sel) {
  const customInput = document.getElementById('cSection');
  if (sel.value === 'Other') {
    customInput.style.display = 'block';
    customInput.value = '';
    customInput.focus();
  } else {
    customInput.style.display = 'none';
    customInput.value = sel.value;
  }
}

function setSectionValue(val) {
  const sel = document.getElementById('cSectionSelect');
  const customInput = document.getElementById('cSection');
  if (!val) {
    sel.value = '';
    customInput.style.display = 'none';
    customInput.value = '';
  } else if (SECTION_OPTIONS.includes(val)) {
    sel.value = val;
    customInput.style.display = 'none';
    customInput.value = val;
  } else {
    sel.value = 'Other';
    customInput.style.display = 'block';
    customInput.value = val;
  }
}

function openAddContact() {
  editingContactIdx = -1;
  document.getElementById('contactModalTitle').innerHTML = '<span>✚</span> Add Contact';
  ['cName','cTitle','cPhone','cEmail','cNotes'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('cDistro').checked = false;
  setSectionValue('');
  openModal('contactModal');
}

function openEditContact(idx) {
  editingContactIdx = idx;
  const c = data[currentOrgIdx].contacts[idx];
  document.getElementById('contactModalTitle').innerHTML = '<span>✏️</span> Edit Contact';
  document.getElementById('cName').value = c.name || '';
  document.getElementById('cTitle').value = c.title || '';
  document.getElementById('cPhone').value = c.phone || '';
  document.getElementById('cEmail').value = c.email || '';
  document.getElementById('cNotes').value = c.notes || '';
  document.getElementById('cDistro').checked = !!c.distro;
  setSectionValue(c.section || '');
  openModal('contactModal');
}

function saveContact() {
  const sel = document.getElementById('cSectionSelect');
  const sectionVal = sel.value === 'Other'
    ? document.getElementById('cSection').value.trim()
    : document.getElementById('cSection').value.trim();
  const contact = {
    section: sectionVal,
    title:   document.getElementById('cTitle').value.trim(),
    name:    document.getElementById('cName').value.trim(),
    phone:   document.getElementById('cPhone').value.trim(),
    email:   document.getElementById('cEmail').value.trim(),
    notes:   document.getElementById('cNotes').value.trim(),
    distro:  document.getElementById('cDistro').checked
  };
  if (!contact.name && !contact.title) { alert('Enter a name or title.'); return; }
  if (editingContactIdx >= 0) data[currentOrgIdx].contacts[editingContactIdx] = contact;
  else data[currentOrgIdx].contacts.push(contact);
  closeModal('contactModal'); save(); renderDetail(); updateStats();
}

function toggleDistro(idx, checked) {
  if (currentOrgIdx < 0) return;
  data[currentOrgIdx].contacts[idx].distro = checked;
  save();
  // Update the distro button count without re-rendering the whole detail
  const org = data[currentOrgIdx];
  const distroEmails = org.contacts.filter(c => c.distro && c.email).map(c => c.email);
  const btn = document.getElementById('emailDistroBtn');
  const distroBadge = document.getElementById('distroCountBadge');
  distroBadge.textContent = distroEmails.length;
  btn.classList.toggle('disabled', distroEmails.length === 0);
}

function saveOpNotes() {
  if (currentOrgIdx < 0) return;
  const ta = document.getElementById('opNotesText');
  if (!ta) return;
  data[currentOrgIdx].op_notes = ta.value;
  save();
}

function emailDistro() {
  if (currentOrgIdx < 0) return;
  const org = data[currentOrgIdx];
  const emails = (org.contacts || []).filter(c => c.distro && c.email).map(c => c.email);
  if (!emails.length) return;
  window.location.href = 'mailto:' + emails.join(',');
}

function openAddOrg() {
  editingOrgMode = false;
  document.getElementById('orgModalTitle').innerHTML = '<span>✚</span> Add Organization';
  ['oName','oPrimaryPhone','oPrimaryEmail'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('oType').value = 'airline';
  openModal('orgModal');
}

function openEditOrg() {
  if (currentOrgIdx < 0) return;
  editingOrgMode = true;
  const o = data[currentOrgIdx];
  document.getElementById('orgModalTitle').innerHTML = '<span>✏️</span> Edit Organization';
  document.getElementById('oName').value = o.name;
  document.getElementById('oType').value = o.type;
  document.getElementById('oPrimaryPhone').value = o.primary_phone;
  document.getElementById('oPrimaryEmail').value = o.primary_email;
  openModal('orgModal');
}

function saveOrg() {
  const name = document.getElementById('oName').value.trim();
  if (!name) { alert('Organization name is required.'); return; }
  const org = {
    sheet: name,
    name,
    type: document.getElementById('oType').value,
    primary_phone: document.getElementById('oPrimaryPhone').value.trim(),
    primary_email: document.getElementById('oPrimaryEmail').value.trim(),
    contacts: editingOrgMode ? data[currentOrgIdx].contacts : []
  };
  if (editingOrgMode) data[currentOrgIdx] = org;
  else { data.push(org); currentOrgIdx = data.length - 1; }
  closeModal('orgModal'); save(); renderOrgList(); renderDetail(); updateStats();
}

// ── DELETE ────────────────────────────────────────────────────────────────────
function confirmDeleteContact(idx) {
  pendingDeleteType = 'contact'; pendingDeleteIdx = idx;
  document.getElementById('confirmMsg').textContent = 'Delete ' + (data[currentOrgIdx].contacts[idx].name || 'this contact') + '?';
  document.getElementById('confirmOverlay').classList.add('open');
}

function confirmDeleteOrg() {
  if (currentOrgIdx < 0) return;
  pendingDeleteType = 'org'; pendingDeleteIdx = currentOrgIdx;
  document.getElementById('confirmMsg').textContent = 'Delete &ldquo;' + data[currentOrgIdx].name + '&rdquo; and all its contacts?';
  document.getElementById('confirmOverlay').classList.add('open');
}

function closeConfirm() { document.getElementById('confirmOverlay').classList.remove('open'); }

function executeDelete() {
  if (pendingDeleteType === 'contact') {
    data[currentOrgIdx].contacts.splice(pendingDeleteIdx, 1);
    save(); renderDetail();
  } else {
    data.splice(pendingDeleteIdx, 1);
    currentOrgIdx = -1;
    save(); renderOrgList(); renderDetail();
  }
  updateStats(); closeConfirm();
}

// ── KEYBOARD ──────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal('contactModal'); closeModal('orgModal'); closeConfirm(); }
});

// ── INIT ──────────────────────────────────────────────────────────────────────
// Data load + initial render handled by the IIFE above (loadFromCloud / applyData).
</script>
</body>
</html>
